<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLab // Academy & Ciberseguridad Avanzada</title>
  
  <!-- Tailwind CSS CDN -->

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-emerald-500 selection:text-slate-950">
  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [viewMode, setViewMode] = useState('welcome');
      const [activeModule, setActiveModule] = useState('phishing');
      const [activeCourseDoc, setActiveCourseDoc] = useState('p_intro');
      const [score, setScore] = useState(0);
      const [courseProgress, setCourseProgress] = useState({
        phishing: 0,
        passwords: 0,
        sqli: 0,
        networking: 0,
        soc: 0
      });
      const [terminalLogs, setTerminalLogs] = useState([
        { time: new Date().toLocaleTimeString(), text: 'SISTEMA INICIALIZADO: Plataforma Cisco NetAcad & CyberOps lista.', type: 'info' }
      ]);

      const [aiMessages, setAiMessages] = useState([
        {
          role: 'assistant',
          text: '¡Hola! Soy tu Consultor Virtual de Ciberseguridad. Puedo charlar contigo amigablemente o buscar noticias y vulnerabilidades recientes de ciberseguridad en la web en tiempo real cuando me pidas noticias. ¿En qué te ayudo hoy?'
        }
      ]);
      const [inputQuery, setInputQuery] = useState('');

      const handleSendMessage = async (text) => {
        const userMsg = { role: 'user', text };
        setAiMessages(prev => [...prev, userMsg]);
        setInputQuery('');
        
        const lower = text.toLowerCase().trim();
        const isNewsQuery = lower.includes('noticia') || lower.includes('noticias') || lower.includes('actualidad') || lower.includes('cve') || lower.includes('ultimas');

        // Si es un saludo o pregunta casual, respondemos conversacionalmente sin buscar en la web
        if (!isNewsQuery && (lower.includes('hola') || lower.includes('como estas') || lower.includes('que tal') || lower.includes('quien eres') || lower.includes('que sabes'))) {
          let friendlyReply = "¡Hola! Todo excelente por aquí, listo para ayudarte con tus laboratorios y cursos de ciberseguridad. ¿Qué tema o duda técnica tienes hoy?";
          if (lower.includes('quien eres')) {
            friendlyReply = "Soy tu consultor y tutor virtual de ciberseguridad, diseñado con un estilo conversacional y experto para guiarte en redes, criptografía, pentesting y análisis defensivo.";
          } else if (lower.includes('que sabes')) {
            friendlyReply = "Sé sobre arquitectura de sistemas, protocolos SMTP/DNS, hardening de servidores, criptografía (Bcrypt, Argon2, RSA), inyecciones SQL y análisis SOC. ¡Pregúntame lo que necesites!";
          }
          setTimeout(() => {
            setAiMessages(prev => [...prev, { role: 'assistant', text: friendlyReply }]);
          }, 300);
          return;
        }

        // Si explícitamente pide noticias o actualidad, activamos la búsqueda web (Grounding)
        setAiMessages(prev => [...prev, { role: 'assistant', text: '🔍 Buscando noticias y reportes de ciberseguridad en la web...', isPending: true }]);

        try {
          const systemPrompt = "Actúa como un experto mundial en ciberseguridad. Si el usuario pide noticias o actualidad, utiliza la búsqueda web para proveer información reciente y verificada. Si es otra consulta técnica, respóndela con rigor y claridad.";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent`;

          const payload = {
            contents: [{ parts: [{ text: text }] }],
            tools: isNewsQuery ? [{ "google_search": {} }] : [],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const candidate = result.candidates?.[0];

          if (candidate && candidate.content?.parts?.[0]?.text) {
            let answerText = candidate.content.parts[0].text;
            
            let sources = [];
            const groundingMetadata = candidate.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
              sources = groundingMetadata.groundingAttributions
                .map(attr => ({
                  uri: attr.web?.uri,
                  title: attr.web?.title,
                }))
                .filter(s => s.uri && s.title);
            }

            if (sources.length > 0) {
              answerText += "\n\n**🔗 Fuentes de la Web:**\n" + sources.map(s => `- [${s.title}](${s.uri})`).join('\n');
            }

            setAiMessages(prev => {
              const filtered = prev.filter(m => !m.isPending);
              return [...filtered, { role: 'assistant', text: answerText }];
            });
            addLog('CONSULTA PROCESADA: Respuesta generada exitosamente.', 'success');
          } else {
            throw new Error('Respuesta inválida');
          }
        } catch (err) {
          console.error(err);
          setTimeout(() => {
            setAiMessages(prev => {
              const filtered = prev.filter(m => !m.isPending);
              return [...filtered, { role: 'assistant', text: `### 🛡️ Análisis Técnico de "${text}"\n\nEn ciberseguridad y arquitectura de sistemas, abordamos este concepto aplicando control de accesos, validación rigurosa de entradas y defensa en profundidad. ¿Te gustaría que profundicemos en algún ejemplo práctico o de código?` }];
            });
          }, 300);
        }
      };

      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [userProfile, setUserProfile] = useState({
        name: 'Estudiante // Analista SecOps',
        email: 'estudiante@cyberlab.edu',
        role: 'Analista Junior SOC',
        isLoggedIn: false
      });

      const [examAnswers, setExamAnswers] = useState({});
      const [examSubmitted, setExamSubmitted] = useState(false);
      const [examScore, setExamScore] = useState(null);

      const addLog = (text, type = 'info') => {
        const time = new Date().toLocaleTimeString();
        setTerminalLogs(prev => [{ time, text, type }, ...prev.slice(0, 19)]);
      };

      const coursesCatalog = [
        {
          id: 'phishing',
          title: 'Curso 1: Phishing, Autenticación DNS y DMARC',
          category: 'CORREO & SEGURIDAD SMTP',
          difficulty: 'Intermedio',
          time: '12 min',
          description: 'Aprende los fundamentos del protocolo SMTP, suplantación de identidad (Typosquatting), firmas DKIM y configuración de registros SPF y DMARC estrictos.'
        },
        {
          id: 'passwords',
          title: 'Curso 2: Criptografía, Hashes y Fuerza Bruta',
          category: 'CRIPTOGRAFÍA APLICADA',
          difficulty: 'Intermedio',
          time: '15 min',
          description: 'Estudio de entropía criptográfica, funciones KDF deliberadamente lentas (Bcrypt, Argon2id), salting y resistencia a clústeres de GPUs.'
        },
        {
          id: 'sqli',
          title: 'Curso 3: Inyección SQL y Seguridad en Bases de Datos',
          category: 'OWASP WEB SECURITY',
          difficulty: 'Avanzado',
          time: '18 min',
          description: 'Análisis de alteración del Árbol Sintáctico Abstracto (AST), exfiltración de tablas de usuarios y mitigación mediante Consultas Preparadas.'
        },
        {
          id: 'networking',
          title: 'Curso 4: Fundamentos de Redes Seguras (Cisco CCNA)',
          category: 'INFRAESTRUCTURA & FIREWALL',
          difficulty: 'Intermedio',
          time: '20 min',
          description: 'Inspección de estado en Stateful Firewalls, Handshake TCP de 3 vías, segmentación mediante VLANs y túneles cifrados con TLS 1.3.'
        },
        {
          id: 'soc',
          title: 'Curso 5: Operaciones SOC y Respuesta a Incidentes',
          category: 'CYBEROPS & SIEM',
          difficulty: 'Experto',
          time: '25 min',
          description: 'Monitoreo de telemetría SIEM, análisis forense de artefactos mediante reglas YARA y triaje de alertas de seguridad empresariales.'
        }
      ];

      const courseDocuments = {
        phishing: {
          title: "Módulo 1: Phishing, Autenticación DNS y DMARC",
          submodules: [
            { id: 'p_intro', code: '1.0', title: 'Introducción a la seguridad del correo y SMTP', count: '2 / 2' },
            { id: 'p_threats', code: '1.1', title: 'Ingeniería Social y Typosquatting', count: '15 / 20' },
            { id: 'p_auth', code: '1.2', title: 'Autenticación Criptográfica (SPF, DKIM y DMARC)', count: '12 / 15' },
            { id: 'p_passkeys', code: '1.3', title: 'Autenticación FIDO2 / Passkeys e Identidad', count: '5 / 17' },
            { id: 'p_quiz', code: '1.4', title: 'Cuestionario Evaluativo de Phishing & Mail Security', count: '0 / 5' }
          ]
        },
        passwords: {
          title: "Módulo 2: Criptografía, Hashes y Fuerza Bruta",
          submodules: [
            { id: 'pass_intro', code: '2.0', title: 'Introducción a la Entropía Criptográfica', count: '3 / 3' },
            { id: 'pass_hashes', code: '2.1', title: 'Limitaciones de MD5 y SHA-256 en Autenticación', count: '10 / 12' },
            { id: 'pass_kdf', code: '2.2', title: 'Funciones KDF Lentas: Bcrypt y Argon2id', count: '8 / 10' },
            { id: 'pass_salts', code: '2.3', title: 'Salting Criptográfico y Defensa ante GPUs', count: '6 / 8' },
            { id: 'pass_quiz', code: '2.4', title: 'Cuestionario Evaluativo de Criptografía Aplicada', count: '0 / 5' }

            { id: 'sql_prep', code: '3.3', title: 'Consultas Preparadas (Parameterized Queries)', count: '7 / 9' },

            { id: 'net_quiz', code: '4.4', title: 'Cuestionario Evaluativo de Redes CCNA', count: '0 / 5' }

            { id: 'soc_intro', code: '5.0', title: 'Arquitectura y Flujo de Trabajo en un SOC', count: '3 / 3' },
            { id: 'soc_siem', code: '5.1', title: 'Monitoreo de Telemetría e Ingesta SIEM', count: '18 / 20' },
            { id: 'soc_yara', code: '5.2', title: 'Reglas YARA y Análisis de Artefactos Malware', count: '10 / 12' },
            { id: 'soc_triage', code: '5.3', title: 'Fases de Contención y Erradicación de Amenazas', count: '7 / 8' },
            { id: 'soc_quiz', code: '5.4', title: 'Cuestionario Evaluativo de Cisco CyberOps', count: '0 / 5' }
          ]
        }
      };

      const moduleExams = {
        phishing: [
          { q: '¿Qué protocolo de correo electrónico carece nativamente de mecanismos de validación de emisor?', options: ['IMAP', 'SMTP', 'POP3', 'HTTP'], correct: 1, explanation: 'SMTP fue diseñado sin autenticación nativa, permitiendo suplantación fácil de remitentes.' },
          { q: '¿Qué registro DNS publica las IPs autorizadas a enviar correos por un dominio?', options: ['MX', 'SPF', 'CNAME', 'PTR'], correct: 1, explanation: 'SPF (Sender Policy Framework) declara las direcciones IP permitidas.' },
          { q: '¿Qué acción realiza DMARC con política "p=reject"?', options: ['Rechaza y descarta el correo', 'Lo envía a spam', 'Lo cifra', 'Lo reenvía al administrador'], correct: 0, explanation: 'p=reject descarta el mensaje inmediatamente al fallar SPF/DKIM.' },
          { q: '¿Qué es Typosquatting?', options: ['Un ataque DDoS', 'Registro de dominios con errores tipográficos para engañar', 'Inyección SQL', 'Robo de certificados SSL'], correct: 1, explanation: 'Typosquatting usa nombres similares (ej. paypa1.com) para phishing.' },
          { q: '¿Qué estándar de autenticación sin contraseña es inmune al phishing tradicional?', options: ['SMS 2FA', 'Passkeys / FIDO2', 'Contraseñas de 8 caracteres', 'Preguntas de seguridad'], correct: 1, explanation: 'FIDO2 / Passkeys utiliza criptografía asimétrica ligada al origen del sitio web.' }
        ],
        passwords: [
          { q: '¿Por qué MD5 es inseguro para contraseñas?', options: ['Es muy lento', 'Es demasiado rápido y vulnerable a ataques GPU', 'Solo acepta números', 'Requiere conexión a internet'], correct: 1, explanation: 'Su alta velocidad permite probar miles de millones de hashes por segundo en GPUs.' },
          { q: '¿Qué función cumple el Salt en el hashing?', options: ['Cifra la base de datos', 'Evita tablas Rainbow y personaliza el hash por usuario', 'Aumenta el tamaño de la pantalla', 'Envía alertas'], correct: 1, explanation: 'El salt aleatorio asegura que dos claves iguales generen hashes distintos.' },
          { q: '¿Cuál es un algoritmo KDF recomendado moderno?', options: ['MD5', 'SHA-1', 'Argon2id', 'Base64'], correct: 2, explanation: 'Argon2id es el ganador de la Password Hashing Competition, resistente a ataques ASIC/GPU.' },
          { q: '¿Qué mide la entropía de una contraseña?', options: ['Su longitud en bytes', 'Su imprevisibilidad y resistencia a fuerza bruta', 'La velocidad de la red', 'El costo en memoria RAM'], correct: 1, explanation: 'La entropía calcula en bits la dificultad de adivinar una combinación.' },
          { q: '¿Qué es Credential Stuffing?', options: ['Relleno de formularios', 'Prueba automatizada de credenciales filtradas en múltiples sitios', 'Cifrado de discos', 'Respaldo de datos'], correct: 1, explanation: 'Los atacantes aprovechan que las personas reutilizan contraseñas en varios servicios.' }
        ],
        sqli: [
          { q: '¿Cómo ocurre una Inyección SQL clásica?', options: ['Por contraseñas cortas', 'Por concatenar entradas de usuario directamente en la consulta', 'Por usar HTTPS', 'Por fallos en el cableado de red'], correct: 1, explanation: 'La concatenación permite al usuario alterar la sintaxis de la consulta SQL.' },
          { q: '¿Qué evalúa la tautología \'1\'=\'1\' en un ataque SQLi?', options: ['Falso', 'Verdadero incondicional', 'Error de sintaxis', 'Nulo'], correct: 1, explanation: 'Hace que la condición WHERE siempre sea verdadera, retornando todos los registros.' },
          { q: '¿Cuál es la defensa definitiva contra SQLi?', options: ['Firewalls WAF', 'Consultas Preparadas (Parameterized Queries)', 'Usar mayúsculas', 'Cambiar de puerto SQL'], correct: 1, explanation: 'Las consultas preparadas separan estrictamente el código de los datos.' },
          { q: '¿Qué herramienta permite automatizar SQL Injection?', options: ['Wireshark', 'Sqlmap', 'Nmap', 'Postman'], correct: 1, explanation: 'Sqlmap es la herramienta estándar de pentesting para detectar y explotar SQLi.' },
          { q: '¿Qué es Blind SQL Injection?', options: ['Inyección sin conexión', 'Cuando la base de datos no retorna resultados visuales directos y se infiere por respuestas booleanas/tiempo', 'Inyección en servidores ciegos', 'Ninguna'], correct: 1, explanation: 'En SQLi ciega se deduce la información haciendo preguntas Verdadero/Falso al motor.' }
        ],
        networking: [
          { q: '¿Qué protocolo opera en la capa de transporte asegurando entrega y orden?', options: ['IP', 'TCP', 'UDP', 'ICMP'], correct: 1, explanation: 'TCP establece conexión orientada y control de flujo.' },
          { q: '¿Qué es el Handshake TCP de 3 vías?', options: ['Un ataque de red', 'Secuencia SYN, SYN-ACK, ACK para iniciar sesión', 'Un tipo de cable', 'Un respaldo de datos'], correct: 1, explanation: 'Permite sincronizar los números de secuencia entre cliente y servidor.' },
          { q: '¿Qué función cumple una VLAN?', options: ['Acelerar el internet', 'Segmentar redes lógicamente para aislar tráfico', 'Cifrar correos', 'Crear bases de datos'], correct: 1, explanation: 'Divide un switch físico en múltiples redes virtuales de seguridad.' },
          { q: '¿Qué versión de TLS introduce mejoras sustanciales en velocidad y privacidad en el handshake?', options: ['TLS 1.0', 'TLS 1.1', 'TLS 1.2', 'TLS 1.3'], correct: 3, explanation: 'TLS 1.3 reduce el handshake a 1-RTT y elimina algoritmos criptográficos obsoletos.' },
          { q: '¿Qué es un Firewall Stateful?', options: ['Un firewall que no guarda memoria', 'Un firewall que inspecciona el estado y contexto de las conexiones activas', 'Un antivirus de escritorio', 'Un switch Cisco'], correct: 1, explanation: 'Mantiene una tabla de estados para validar paquetes legítimos dentro de una sesión.' }
        ],
        soc: [
          { q: '¿Qué significa SIEM en ciberseguridad?', options: ['Sistema de Impresión', 'Security Information and Event Management', 'Servidor Interno de E-mail', 'Sistema de Ingeniería Móvil'], correct: 1, explanation: 'SIEM recopila y analiza registros de logs en tiempo real para detectar amenazas.' },
          { q: '¿Para qué se utilizan las reglas YARA?', options: ['Para diseñar páginas web', 'Para clasificar y detectar muestras de malware mediante patrones', 'Para configurar routers', 'Para cifrar discos'], correct: 1, explanation: 'YARA es el estándar para la búsqueda de patrones y huellas de malware.' },
          { q: '¿Cuál es la primera fase ante un incidente en un SOC?', options: ['Erradicación', 'Triaje y Detección de Alertas', 'Cierre de la empresa', 'Formatear servidores'], correct: 1, explanation: 'El triaje evalúa si una alerta es un falso positivo o un ataque real.' },
          { q: '¿Qué es Contención en respuesta a incidentes?', options: ['Dejar que el atacante continúe', 'Aislar los sistemas afectados para impedir el movimiento lateral', 'Borrar los logs', 'Publicar el hack en redes'], correct: 1, explanation: 'La contención detiene la propagación de la amenaza en la red.' },
          { q: '¿Qué puerto por defecto utiliza Syslog para telemetría de red?', options: ['80', '443', '514', '3306'], correct: 2, explanation: 'UDP 514 es el puerto estándar histórico para envío de mensajes de log Syslog.' }
        ]
      };

      const handleStartCourse = (courseId) => {
        setActiveModule(courseId);
        setActiveCourseDoc(courseDocuments[courseId]?.submodules[0]?.id || 'intro');
        setViewMode('courses');
        setExamSubmitted(false);
        setExamAnswers({});
        setExamScore(null);

        setCourseProgress(prev => ({
          ...prev,
          [courseId]: Math.max(prev[courseId] || 0, 25)
        }));
        addLog(`ACCESO AL CURSO: ${courseDocuments[courseId]?.title}`, 'info');
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setUserProfile(prev => ({ ...prev, isLoggedIn: true }));
        setShowAuthModal(false);
        addLog(`SESIÓN INICIADA: Bienvenido de nuevo, ${userProfile.name}`, 'success');
      };

      const handleExamSubmit = () => {
        const questions = moduleExams[activeModule] || [];
        let correctCount = 0;
        questions.forEach((q, idx) => {
          if (examAnswers[idx] === q.correct) correctCount++;
        });

        const percentage = Math.round((correctCount / questions.length) * 100);
        setExamScore(percentage);
        setExamSubmitted(true);

        if (percentage >= 70) {
          setScore(prev => prev + 150);
          setCourseProgress(prev => ({ ...prev, [activeModule]: 100 }));
          addLog(`EXAMEN APROBADO (${activeModule.toUpperCase()}): ${percentage}% +150 XP`, 'success');
        } else {
          addLog(`EXAMEN FINALIZADO (${activeModule.toUpperCase()}): ${percentage}%. Requiere repaso.`, 'warn');
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col selection:bg-emerald-500 selection:text-slate-950">
          
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              
              <div 
                className="flex items-center space-x-3 cursor-pointer group" 
                onClick={() => setViewMode('welcome')}
              >
                <div className="p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 group-hover:border-emerald-400 transition font-bold font-mono">
                  🔒
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-wider text-slate-100 font-mono flex items-center gap-2">
                    CYBERLAB <span className="text-emerald-400">// ACADEMY</span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Plataforma Certificada de Ciberseguridad</p>
                </div>
              </div>

              <div className="flex items-center gap-2 font-mono text-xs">
                <button
                  onClick={() => setViewMode('welcome')}
                  className={`px-3.5 py-1.5 rounded-md border transition flex items-center gap-1.5 ${
                    viewMode === 'welcome'
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 font-bold'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  🏠 Inicio
                </button>
                <button
                  onClick={() => setViewMode('courses')}
                  className={`px-3.5 py-1.5 rounded-md border transition flex items-center gap-1.5 ${
                    viewMode === 'courses'
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 font-bold'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📚 Cursos &amp; Docs
                </button>
                <button
                  onClick={() => setViewMode('labs')}
                  className={`px-3.5 py-1.5 rounded-md border transition flex items-center gap-1.5 ${
                    viewMode === 'labs'
                      ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 font-bold'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  🧪 Labs Prácticos
                </button>
                <button
                  onClick={() => setViewMode('ai')}
                  className={`px-3.5 py-1.5 rounded-md border transition flex items-center gap-1.5 ${
                    viewMode === 'ai'
                      ? 'bg-purple-500/20 text-purple-300 border-purple-500/40 font-bold'
                      : 'bg-purple-950/40 border-purple-800/50 text-purple-300 hover:bg-purple-900/40'
                  }`}
                >
                  🤖 Consultor IA
                </button>
              </div>

              <div className="flex items-center gap-3">
